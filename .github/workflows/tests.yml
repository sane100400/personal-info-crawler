name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e . "ruff>=0.11,<1"
      - run: ruff check collector tests
      - run: ruff format --check collector tests
      - run: python -m compileall -q collector tests
      - run: python -m unittest discover -s tests -v
